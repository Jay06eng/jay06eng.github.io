<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#0f1220"/>

  <!-- Header -->
  <text x="400" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Credit-Line Approval Model</text>
  <text x="400" y="68" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">XGBoost · SHAP · Python · Explainable ML</text>

  <!-- Input features box -->
  <rect x="40" y="90" width="175" height="230" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="128" y="115" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#94a3b8">APPLICANT FEATURES</text>
  <text x="60" y="140" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Revenue (30d)</text>
  <rect x="60" y="146" width="135" height="5" rx="2" fill="#334155"/>
  <rect x="60" y="146" width="110" height="5" rx="2" fill="#38bdf8"/>
  <text x="60" y="168" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Ad Spend History</text>
  <rect x="60" y="174" width="135" height="5" rx="2" fill="#334155"/>
  <rect x="60" y="174" width="125" height="5" rx="2" fill="#38bdf8"/>
  <text x="60" y="196" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Account Age</text>
  <rect x="60" y="202" width="135" height="5" rx="2" fill="#334155"/>
  <rect x="60" y="202" width="90" height="5" rx="2" fill="#38bdf8"/>
  <text x="60" y="224" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Payment Behavior</text>
  <rect x="60" y="230" width="135" height="5" rx="2" fill="#334155"/>
  <rect x="60" y="230" width="115" height="5" rx="2" fill="#38bdf8"/>
  <text x="60" y="252" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Credit Utilization</text>
  <rect x="60" y="258" width="135" height="5" rx="2" fill="#334155"/>
  <rect x="60" y="258" width="70" height="5" rx="2" fill="#38bdf8"/>
  <text x="60" y="280" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">Risk Score</text>
  <rect x="60" y="286" width="135" height="5" rx="2" fill="#334155"/>
  <rect x="60" y="286" width="50" height="5" rx="2" fill="#f59e0b"/>

  <!-- Arrow -->
  <line x1="215" y1="205" x2="270" y2="205" stroke="#334155" stroke-width="2"/>
  <polygon points="266,199 278,205 266,211" fill="#334155"/>

  <!-- XGBoost model box -->
  <rect x="278" y="130" width="155" height="150" rx="10" fill="#0f172a" stroke="#6366f1" stroke-width="2"/>
  <text x="355" y="165" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="800" fill="#818cf8">XGBoost</text>
  <text x="355" y="185" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#64748b">+ SHAP Explainer</text>
  <rect x="298" y="198" width="115" height="28" rx="5" fill="#1e293b"/>
  <text x="355" y="217" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#94a3b8">Decision Trees × 500</text>
  <text x="355" y="248" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Accuracy: 91.4%</text>
  <text x="355" y="264" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">AUC-ROC: 0.96</text>

  <!-- Arrow -->
  <line x1="433" y1="205" x2="488" y2="205" stroke="#334155" stroke-width="2"/>
  <polygon points="484,199 496,205 484,211" fill="#334155"/>

  <!-- Output cards -->
  <rect x="496" y="100" width="260" height="90" rx="10" fill="#0d2b1d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="626" y="135" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#22c55e">APPROVED</text>
  <text x="626" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Credit Line: $25,000 · Score: 0.87</text>
  <text x="626" y="178" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#22c55e">Low risk · High revenue signal</text>

  <rect x="496" y="210" width="260" height="90" rx="10" fill="#271e00" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="626" y="245" text-anchor="middle" font-family="system-ui,sans-serif" font-size="18" font-weight="800" fill="#f59e0b">REVIEW</text>
  <text x="626" y="268" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Flagged · Score: 0.51 · Manual check</text>
  <text x="626" y="288" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#f59e0b">Mixed signals · Needs analyst review</text>

  <!-- SHAP feature importance bar chart -->
  <rect x="40" y="345" width="720" height="85" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="60" y="368" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#94a3b8">SHAP Feature Importance</text>
  <text x="60" y="390" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Revenue</text>
  <rect x="130" y="381" width="200" height="8" rx="3" fill="#6366f1"/>
  <text x="60" y="410" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Ad Spend</text>
  <rect x="130" y="401" width="155" height="8" rx="3" fill="#6366f1"/>
  <text x="340" y="390" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Payment</text>
  <rect x="395" y="381" width="120" height="8" rx="3" fill="#818cf8"/>
  <text x="340" y="410" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Risk Score</text>
  <rect x="395" y="401" width="90" height="8" rx="3" fill="#818cf8"/>
  <text x="530" y="390" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Acct Age</text>
  <rect x="585" y="381" width="70" height="8" rx="3" fill="#a5b4fc"/>
  <text x="530" y="410" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Utilization</text>
  <rect x="585" y="401" width="50" height="8" rx="3" fill="#a5b4fc"/>
</svg>
