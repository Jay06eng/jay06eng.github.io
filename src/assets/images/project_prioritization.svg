  <rect x="609" y="206" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="609" y="206" width="110" height="6" rx="3" fill="#ef4444"/>
  <text x="646" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#ef4444" font-weight="600">NOT RECOMMENDED</text>

  <!-- Input box -->
  <rect x="45" y="310" width="710" height="50" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="340" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Project brief: </text>
  <text x="155" y="340" font-family="system-ui,sans-serif" font-size="11" fill="#94a3b8">"Build a real-time pricing engine for SMB advertisers on the platform..."</text>

  <!-- Arrow down -->
  <line x1="400" y1="360" x2="400" y2="385" stroke="#334155" stroke-width="1.5"/>
  <polygon points="394,382 400,392 406,382" fill="#334155"/>

  <!-- LLM engine label -->
  <rect x="310" y="395" width="180" height="30" rx="6" fill="#0ea5e920" stroke="#0ea5e9" stroke-width="1"/>
  <text x="400" y="415" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#38bdf8">LLM Decision Engine</text>
</svg>
