  <text x="399" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Confidence: 67%</text>
  <text x="312" y="176" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Impact</text>
  <rect x="362" y="166" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="362" y="166" width="84" height="6" rx="3" fill="#f59e0b"/>
  <text x="312" y="194" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Feasibility</text>
  <rect x="362" y="184" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="362" y="184" width="60" height="6" rx="3" fill="#f59e0b"/>
  <text x="312" y="212" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Risk</text>
  <rect x="362" y="202" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="362" y="202" width="75" height="6" rx="3" fill="#f59e0b"/>
  <text x="399" y="258" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" fill="#f59e0b" font-weight="600">CLARIFICATION NEEDED</text>

  <!-- NO-GO Card -->
  <rect x="539" y="90" width="215" height="185" rx="12" fill="#2b0d0d" stroke="#ef4444" stroke-width="1.5"/>
  <text x="646" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#ef4444">NO-GO</text>
  <text x="646" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Confidence: 88%</text>
  <text x="559" y="180" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Impact</text>
  <rect x="609" y="170" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="609" y="170" width="28" height="6" rx="3" fill="#ef4444"/>
  <text x="559" y="198" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Feasibility</text>
  <rect x="609" y="188" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="609" y="188" width="42" height="6" rx="3" fill="#ef4444"/>
