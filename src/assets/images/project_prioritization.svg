  <text x="152" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#94a3b8">Confidence: 94%</text>
  <text x="65" y="180" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Impact</text>
  <rect x="115" y="170" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="115" y="170" width="118" height="6" rx="3" fill="#22c55e"/>
  <text x="65" y="198" font-family="system-ui,sans-serif" font-size="9" fill="#64748b">Feasibility</text>
  <rect x="115" y="188" width="125" height="6" rx="3" fill="#1e293b"/>
  <rect x="115" y="188" width="105" height="6" rx="3" fill="#22c55e"/>
